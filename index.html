<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#0b0b0e" />
    <meta name="referrer" content="no-referrer" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; base-uri 'none'; object-src 'none'; form-action 'self'; script-src 'self' https://telegram.org; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://study-bot.vanya-study.workers.dev; font-src 'self'; manifest-src 'self'"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Дип" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Дип</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icon-180-v2.png" />
    <link rel="icon" href="./icon-192-v2.png" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="./app.css?v=8" />
  </head>
  <body>
    <div class="glow" aria-hidden="true"></div>

    <div class="app">
      <header class="topbar">
        <button class="icon-btn" id="chatsBtn" aria-label="Чаты">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
            <path d="M4 6h16M4 12h16M4 18h10" />
          </svg>
        </button>
        <div class="brand">
          <span class="dot" id="statusDot"></span>
          <div class="brand__text">
            <div class="brand__title">Дип</div>
            <div class="brand__sub" id="modelLabel">DeepSeek Flash</div>
          </div>
        </div>
        <button class="icon-btn" id="settingsBtn" aria-label="Настройки">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6">
            <circle cx="12" cy="12" r="3.2" />
            <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.56V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.56 1.7 1.7 0 0 0-1.88.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.56-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.55-1.1 1.7 1.7 0 0 0-.34-1.88l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34H9a1.7 1.7 0 0 0 1-1.56V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.56 1.7 1.7 0 0 0 1.88-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87V9a1.7 1.7 0 0 0 1.56 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z" />
          </svg>
        </button>
      </header>

      <main class="feed" id="feed">
        <section class="empty" id="empty">
          <h1>Что решаем?</h1>
          <p>Спроси словами или пришли до 50 фото задач — отвечу коротко и по делу. Фото понимает DeepSeek Flash.</p>
          <div class="samples" id="samples">
            <button class="sample" data-q="Реши 3x − 7 = 14">3x − 7 = 14</button>
            <button class="sample" data-q="Сколько молей в 36 г воды?">36 г воды — сколько молей?</button>
            <button class="sample" data-q="Объясни, почему небо голубое">Почему небо голубое?</button>
          </div>
        </section>
      </main>

      <div class="composer">
        <div class="chips" id="chips">
          <button type="button" class="chip" data-chip="search">Поиск</button>
          <button type="button" class="chip" data-chip="reset">Сброс</button>
        </div>

        <div class="tray" id="tray" hidden>
          <div class="tray__head">
            <span class="tray__count" id="trayCount">0 / 50</span>
            <button type="button" class="tray__clear" id="trayClear">Убрать все</button>
          </div>
          <div class="tray__list" id="trayList"></div>
        </div>

        <form class="inputbar" id="form">
          <button type="button" class="attach" id="photoBtn" aria-label="Прикрепить фото" hidden>
            <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 8.5A2.5 2.5 0 0 1 6.5 6h1.2l1-1.6A1.5 1.5 0 0 1 10 3.7h4a1.5 1.5 0 0 1 1.3.7l1 1.6h1.2A2.5 2.5 0 0 1 20 8.5v8A2.5 2.5 0 0 1 17.5 19h-11A2.5 2.5 0 0 1 4 16.5z" />
              <circle cx="12" cy="12.4" r="3.2" />
            </svg>
          </button>
          <textarea id="text" rows="1" placeholder="Спроси что угодно…" enterkeyhint="send"></textarea>
          <button class="send" id="sendBtn" type="submit" aria-label="Отправить">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 19V5M6 11l6-6 6 6" />
            </svg>
          </button>
        </form>
        <input type="file" id="fileInput" accept="image/*" multiple hidden />
      </div>
    </div>

    <div class="sheet" id="sheet" aria-hidden="true">
      <div class="sheet__backdrop" data-close></div>
      <div class="sheet__panel">
        <div class="sheet__grab"></div>
        <div class="sheet__head">
          <h2>Настройки</h2>
          <button class="icon-btn" data-close aria-label="Закрыть">✕</button>
        </div>

        <div class="field">
          <label>Стиль ответа</label>
          <div class="seg" id="styleSeg">
            <button type="button" data-v="short">Коротко</button>
            <button type="button" data-v="normal">Обычно</button>
            <button type="button" data-v="detail">Подробно</button>
          </div>
        </div>

        <div class="field">
          <label>Модель</label>
          <div class="models" id="modelList"></div>
          <p class="hint" id="modelHint"></p>
        </div>

        <button class="primary" id="saveBtn">Готово</button>
        <div class="sheet__foot" id="sheetFoot"></div>
      </div>
    </div>

    <div class="sheet" id="chats" aria-hidden="true">
      <div class="sheet__backdrop" data-close></div>
      <div class="sheet__panel">
        <div class="sheet__grab"></div>
        <div class="sheet__head">
          <h2>Чаты</h2>
          <button class="icon-btn" data-close aria-label="Закрыть">✕</button>
        </div>
        <button class="primary" id="newChatBtn">Новый чат</button>
        <div class="threads" id="threadList"></div>
      </div>
    </div>

    <div class="gate" id="gate">
      <h1>Вход</h1>
      <p>Вставь личный ключ из ссылки — он сохранится на этом устройстве.</p>
      <input id="gateKey" placeholder="ключ доступа" autocapitalize="off" autocomplete="off" spellcheck="false" />
      <button class="primary" id="gateBtn">Войти</button>
      <div class="err" id="gateErr"></div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="./app.js?v=8"></script>
  </body>
</html>
